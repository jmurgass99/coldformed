[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldformed"
version = "1.0.0"
description = "Cold-formed steel design: effective width, Direct Strength Method, finite strip buckling and Class 4 sections (EN 1993-1-3/1-5, AISI S100)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["cold-formed-steel", "structural-engineering", "eurocode", "EN-1993-1-3", "EN-1993-1-5", "AISI-S100", "direct-strength-method", "finite-strip", "effective-width"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",
    "sectionproperties>=3.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",  # metamodelo sustituto del pandeo elástico (surrogates.py)
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/jmurgass99/coldformed"
Repository = "https://github.com/jmurgass99/coldformed"
Issues = "https://github.com/jmurgass99/coldformed/issues"

[tool.setuptools.packages.find]
include = ["coldformed*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: pruebas unitarias rapidas",
    "integration: pruebas de integracion",
    "api: pruebas de endpoints REST",
    "slow: pruebas lentas (mesh + FEA con sectionproperties)",
]

[tool.coverage.run]
source = ["coldformed"]
branch = true
omit = ["*/__pycache__/*", "*/_brand.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
